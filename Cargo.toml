[package]
name = "kkanpan"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kkanpan"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
chrono = "0.4"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true

[profile.dev]
opt-level = 0
